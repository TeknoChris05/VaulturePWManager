<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="Login.css">
    </head>
    <body>
        <div id="RightFrame">
            <img src="Images/Vaulture.png" alt="Description of image" width="240" height="240" style="margin-right: 20px;">
            <form>
                <div id="Titlediv">
                    <h1 id=TitleHeading> Welcome to Vaulture! </h1> 
                    <p id=PasswordManager>Password and Account Manager</p> 
                </div>
                <div id="input_login">
                    <label id="Username_label" for=Username> Username:</label>
                    <input type="text" id="Username" name="Username" placeholder="Enter Username">
                </div>

                <div class="input-login-password">
                    <label id="Password_label" for="Password">Password:</label>
                    <input type="password" id="Password" name="Password" placeholder="Enter Password">
                    <img src="Images/eye-close.png" id="eyeicon" onclick="togglePassword()">
                </div>
                <div id="CreateAccountdiv">
                    <a id="CreateAccount" href="Create_Account.html">Don't Have an account? Sign Up!</a>
                    <p id="CreateAccount">Forgot Password?</p>
                    <button class="animated-button">Login</button>
                </div>
                

                
              </form>
        </div>
        
        
        
        
        <script src="LoginPage_Script.js" async defer></script>
    </body>
</html>
